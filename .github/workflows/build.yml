# Builds the kernel, runs its tests and packs both libraries.
#
# The packages are uploaded as artifacts on every push, and from a tag they are copied into the Builds folder of
# the company SharePoint library - which is the feed everything else restores from. Publishing to nuget.org is
# deliberately not here: a version cannot be deleted from it, only unlisted, and the API is still moving at
# 0.1.0-alpha. When that stops being true, this file gains one step.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          # net7.0 is out of support and its targeting pack is not in the image by default. The kernel builds
          # for it because Rhino 8 hosts .NET 7, so the runner needs both.
          dotnet-version: |
            7.0.x
            10.0.x

      # No feed is needed to build this: nothing here depends on a Phenome package, which is the whole reason
      # the kernel is the one project that can be built by anybody from a clean clone.
      - name: Build
        run: dotnet build src/Phenome.Geometry/Phenome.Geometry.csproj -c Release

      - name: Build the Rhino conversions
        run: dotnet build src/Phenome.RhinoInterop/Phenome.RhinoInterop.csproj -c Release

      - name: Test
        run: dotnet test tests/Phenome.Geometry.Tests -c Release --logger 'console;verbosity=normal'

      - name: Pack
        run: |
          dotnet pack src/Phenome.Geometry/Phenome.Geometry.csproj -c Release -o dist/nuget
          dotnet pack src/Phenome.RhinoInterop/Phenome.RhinoInterop.csproj -c Release -o dist/nuget

      # Checked rather than assumed: a package whose lib/ is empty, or which lost its documentation, has
      # happened here before and both times `pack` reported success.
      - name: Check the packages carry what they must
        run: |
          set -e
          for pkg in dist/nuget/*.nupkg; do
            echo "== $pkg"
            unzip -l "$pkg" | grep -E 'lib/net(7|10)\.0/.*\.(dll|xml)$' || {
              echo "no assemblies or no documentation in $pkg"; exit 1; }
          done
          unzip -l dist/nuget/Phenome.Geometry.*.nupkg | grep -q 'lib/net7.0/' || {
            echo 'Phenome.Geometry has no net7.0, so no Rhino plugin can use it'; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/nuget/*.nupkg

  # Publishing means copying the packages into the Builds folder of the company SharePoint library, which a
  # hosted runner cannot see: it is a synced folder on our own machines. So this runs on the self-hosted
  # Windows runner, and is gated on a variable rather than on a label - a job asking for a runner that does not
  # exist queues for six hours and then fails, which is worse than not running.
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && vars.PHENOME_SELF_HOSTED == 'true'
    runs-on: [self-hosted, windows]

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist/nuget

      - name: Copy to the Builds folder
        shell: pwsh
        run: |
          # Forward slashes on purpose: PowerShell takes them on Windows, and they survive every layer
          # of quoting between here and the runner without turning into an escape.
          $feed = Join-Path $env:USERPROFILE 'Object/Object - Documents/Workers WO/Builds/Phenome/nuget'
          if (-not (Test-Path $feed)) {
            throw "The package folder is not at $feed - is the SharePoint library synced on this runner?"
          }

          $packages = Get-ChildItem dist/nuget -Filter '*.nupkg'
          $packages | ForEach-Object { Copy-Item $_.FullName $feed -Force; "  $($_.Name) -> Builds" }

          # OneDrive takes its own time: the file is here before it is anywhere else, so a build on another
          # machine immediately after this may still restore the previous version.
          Write-Host '  published locally; OneDrive syncs it to everybody else in its own time'

          if ($env:TEAMS_WEBHOOK) {
            $names = ($packages | ForEach-Object { $_.BaseName }) -join ', '
            $body = @{ text = "**$names** published to Builds on SharePoint." } | ConvertTo-Json
            Invoke-RestMethod -Uri $env:TEAMS_WEBHOOK -Method Post -ContentType 'application/json' -Body $body
            Write-Host '  Teams notified'
          }
          else { Write-Host '  TEAMS_WEBHOOK is not set - nobody notified' }
        env:
          TEAMS_WEBHOOK: ${{ secrets.TEAMS_WEBHOOK }}
