# Builds the kernel, runs its tests and packs both libraries.
#
# The packages are uploaded as artifacts on every push, and from a tag they are copied into the Builds folder of
# the company SharePoint library - which is the feed everything else restores from. Publishing to nuget.org is
# deliberately not here: a version cannot be deleted from it, only unlisted, and the API is still moving at
# 0.1.0-alpha. When that stops being true, this file gains one step.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          # net7.0 is out of support and its targeting pack is not in the image by default. The kernel builds
          # for it because Rhino 8 hosts .NET 7, so the runner needs both.
          dotnet-version: |
            7.0.x
            10.0.x

      # No feed is needed to build this: nothing here depends on a Phenome package, which is the whole reason
      # the kernel is the one project that can be built by anybody from a clean clone.
      - name: Build
        run: dotnet build src/Phenome.Geometry/Phenome.Geometry.csproj -c Release

      - name: Build the Rhino conversions
        run: dotnet build src/Phenome.RhinoInterop/Phenome.RhinoInterop.csproj -c Release

      - name: Test
        run: dotnet test tests/Phenome.Geometry.Tests -c Release --logger 'console;verbosity=normal'

      - name: Pack
        run: |
          dotnet pack src/Phenome.Geometry/Phenome.Geometry.csproj -c Release -o dist/nuget
          dotnet pack src/Phenome.RhinoInterop/Phenome.RhinoInterop.csproj -c Release -o dist/nuget

      # Checked rather than assumed: a package whose lib/ is empty, or which lost its documentation, has
      # happened here before and both times `pack` reported success.
      - name: Check the packages carry what they must
        run: |
          set -e
          for pkg in dist/nuget/*.nupkg; do
            echo "== $pkg"
            unzip -l "$pkg" | grep -E 'lib/net(7|10)\.0/.*\.(dll|xml)$' || {
              echo "no assemblies or no documentation in $pkg"; exit 1; }
          done
          unzip -l dist/nuget/Phenome.Geometry.*.nupkg | grep -q 'lib/net7.0/' || {
            echo 'Phenome.Geometry has no net7.0, so no Rhino plugin can use it'; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/nuget/*.nupkg

  # Publishing is two places at once: the Builds folder on SharePoint, which is how everybody else gets the
  # packages, and the folder this machine restores from, so the next build here has something to restore.
  #
  # SharePoint is reached through Graph rather than a synced folder, because the runner does not sync the
  # library. The app registration holds Sites.Selected, which is a permission to *be granted* access per site
  # rather than access itself - if this ever returns 403, that per-site grant is the first thing to check and
  # almost always the answer.
  #
  # Runs on the self-hosted runner and is gated on a variable rather than a label: a job asking for a runner
  # that does not exist queues for six hours and then fails, which is worse than not running.
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && vars.PHENOME_SELF_HOSTED == 'true'
    runs-on: [self-hosted, windows]

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist/nuget

      - name: Publish
        shell: pwsh
        env:
          TENANT: ${{ vars.PHENOME_GRAPH_TENANT }}
          CLIENT_ID: ${{ vars.PHENOME_GRAPH_CLIENT_ID }}
          SECRET: ${{ secrets.PHENOME_GRAPH_SECRET }}
          DRIVE: ${{ vars.PHENOME_PUBLISH_DRIVE }}
          FOLDER: ${{ vars.PHENOME_PUBLISH_FOLDER }}
          TEAMS_WEBHOOK: ${{ secrets.TEAMS_WEBHOOK }}
        run: |
          $packages = Get-ChildItem dist/nuget -Filter '*.nupkg'
          if (-not $packages) { throw 'nothing to publish' }

          # The local feed first: it is what every build on this machine restores from, and it works whether or
          # not SharePoint does.
          if (-not $env:PHENOME_FEED) { throw 'PHENOME_FEED is not set on this runner' }
          New-Item -ItemType Directory -Force $env:PHENOME_FEED | Out-Null
          $packages | ForEach-Object { Copy-Item $_.FullName $env:PHENOME_FEED -Force }
          Write-Host "  $($packages.Count) package(s) -> $env:PHENOME_FEED"

          foreach ($name in 'TENANT','CLIENT_ID','SECRET','DRIVE','FOLDER') {
            if (-not (Get-Item "env:$name" -ErrorAction SilentlyContinue).Value) {
              Write-Host "  $name is not set - published locally only, nothing sent to SharePoint."
              exit 0
            }
          }

          $token = (Invoke-RestMethod -Method POST -Uri "https://login.microsoftonline.com/$env:TENANT/oauth2/v2.0/token" -Body @{
            client_id = $env:CLIENT_ID; client_secret = $env:SECRET
            scope = 'https://graph.microsoft.com/.default'; grant_type = 'client_credentials'
          }).access_token
          $headers = @{ Authorization = "Bearer $token" }

          foreach ($p in $packages) {
            $uri = "https://graph.microsoft.com/v1.0/drives/$env:DRIVE/root:/$env:FOLDER/$($p.Name)`:/content"
            $up = Invoke-RestMethod -Method PUT -Headers $headers -ContentType 'application/octet-stream' `
              -InFile $p.FullName -Uri $uri
            Write-Host "  $($up.name) -> SharePoint, $($up.size) bytes"
          }

          if ($env:TEAMS_WEBHOOK) {
            $names = ($packages | ForEach-Object { $_.BaseName }) -join ', '
            $body = @{ text = "**$names** published to Builds." } | ConvertTo-Json
            Invoke-RestMethod -Uri $env:TEAMS_WEBHOOK -Method Post -ContentType 'application/json' -Body $body
          }
